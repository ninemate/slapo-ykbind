---
- name: Wait before next image export poll
  ansible.builtin.pause:
    seconds: "{{ ldap_local_save_poll_delay }}"
  when: save_poll_idx | int > 0
  run_once: true

- name: Check local docker save status
  ansible.builtin.async_status:
    jid: "{{ ldap_local_save_async.ansible_job_id }}"
  register: ldap_local_save_status_result
  delegate_to: localhost
  become: false
  run_once: true

- name: Read current local image archive size
  ansible.builtin.shell: |
    if [ -f "{{ ldap_local_image_archive }}" ]; then
      stat -c %s "{{ ldap_local_image_archive }}"
    else
      echo 0
    fi
  args:
    executable: /bin/bash
  register: ldap_local_image_archive_size_cmd
  changed_when: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Print local docker save progress
  ansible.builtin.debug:
    msg: >-
      docker save progress:
      {{ (ldap_local_image_archive_size_cmd.stdout | int) | human_readable }}
      / approx
      {{ (ldap_local_image_expected_size | int) | human_readable }}
  when: (ldap_local_image_archive_size_cmd.stdout | int) > (ldap_local_save_prev_size | int)
  run_once: true

- name: Update local save polling facts
  ansible.builtin.set_fact:
    ldap_local_save_finished: "{{ ldap_local_save_status_result.finished | default(0) | int == 1 }}"
    ldap_local_save_prev_size: "{{ ldap_local_image_archive_size_cmd.stdout | int }}"
    ldap_local_save_result_rc: "{{ ldap_local_save_status_result.rc | default(-1) }}"
  run_once: true
