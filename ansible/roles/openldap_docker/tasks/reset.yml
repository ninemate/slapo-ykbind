---
- name: Stop OpenLDAP container before full_import reset
  ansible.builtin.command:
    argv:
      - docker
      - stop
      - "{{ ldap_container_name }}"
  register: ldap_reset_stop_container
  changed_when: ldap_reset_stop_container.rc == 0
  failed_when: false
  when: ldap_full_import_requested | bool

- name: Remove OpenLDAP container before full_import reset
  ansible.builtin.command:
    argv:
      - docker
      - rm
      - "{{ ldap_container_name }}"
  register: ldap_reset_remove_container
  changed_when: ldap_reset_remove_container.rc == 0
  failed_when: false
  when: ldap_full_import_requested | bool

- name: Remove persistent LDAP data/config directories before full_import
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ldap_data_dir }}"
    - "{{ ldap_config_dir }}"
  when: ldap_full_import_requested | bool

- name: Show reset target paths for full_import
  ansible.builtin.debug:
    msg:
      - "full_import mode reset completed."
      - "Persistent data dir removed: {{ ldap_data_dir }}"
      - "Persistent config dir removed: {{ ldap_config_dir }}"
      - "Deploy root preserved: {{ ldap_deploy_root }}"
  when: ldap_full_import_requested | bool
