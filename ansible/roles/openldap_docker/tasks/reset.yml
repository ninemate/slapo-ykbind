---
- name: Stop OpenLDAP container before requested full import reset
  ansible.builtin.command:
    argv:
      - docker
      - stop
      - "{{ ldap_container_name }}"
  register: ldap_reset_stop_container
  changed_when: ldap_reset_stop_container.rc == 0
  failed_when: false
  when:
    - ldap_full_import_requested | default(false) | bool
    - ldap_reset_before_full_import | bool

- name: Remove OpenLDAP container before requested full import reset
  ansible.builtin.command:
    argv:
      - docker
      - rm
      - "{{ ldap_container_name }}"
  register: ldap_reset_remove_container
  changed_when: ldap_reset_remove_container.rc == 0
  failed_when: false
  when:
    - ldap_full_import_requested | default(false) | bool
    - ldap_reset_before_full_import | bool

- name: Remove persistent LDAP data/config directories before requested full import reset
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ldap_data_dir }}"
    - "{{ ldap_config_dir }}"
  when:
    - ldap_full_import_requested | default(false) | bool
    - ldap_reset_before_full_import | bool

- name: Show full import reset target paths
  ansible.builtin.debug:
    msg:
      - "Reset requested for full import."
      - "Removed persistent data dir: {{ ldap_data_dir }}"
      - "Removed persistent config dir: {{ ldap_config_dir }}"
      - "Deploy root remains: {{ ldap_deploy_root }}"
  when:
    - ldap_full_import_requested | default(false) | bool
    - ldap_reset_before_full_import | bool
