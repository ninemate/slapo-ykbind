---
- name: Verify docker-compose is available
  ansible.builtin.command:
    argv:
      - docker-compose
      - version
  register: ldap_docker_compose_version
  changed_when: false

- name: Copy prebuilt image archive to target host
  ansible.builtin.copy:
    src: "{{ ldap_local_image_archive }}"
    dest: "{{ ldap_remote_image_archive }}"
    mode: "0644"
  register: ldap_remote_image_archive_copy
  when: ldap_requires_image_refresh | bool

- name: Check whether the image already exists on target host
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ ldap_image_name }}"
  register: ldap_remote_image_inspect
  changed_when: false
  failed_when: false
  when: ldap_requires_image_refresh | bool

- name: Load prebuilt image on target host
  ansible.builtin.command:
    argv:
      - docker
      - load
      - -i
      - "{{ ldap_remote_image_archive }}"
  register: ldap_remote_image_load
  when:
    - ldap_requires_image_refresh | bool
    - ldap_remote_image_archive_copy.changed or ldap_remote_image_inspect.rc != 0

- name: Check whether the managed systemd service is already active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - "{{ ldap_systemd_service_name }}"
  register: ldap_systemd_service_active_check
  changed_when: false
  failed_when: false

- name: Determine whether the managed systemd service needs a restart
  ansible.builtin.set_fact:
    ldap_systemd_service_restart_required: >-
      {{
        (ldap_compose_manifest_changed | default(false))
        or (ldap_systemd_unit_changed | default(false))
        or (ldap_remote_image_load.changed | default(false))
        or (
          (ldap_maintenance_mode | bool)
          and (
            (ldap_maintenance_restart_container | bool)
            or (ldap_tls_material_changed | default(false) | bool)
          )
        )
      }}

- name: Enable and reconcile the managed systemd service
  ansible.builtin.systemd_service:
    name: "{{ ldap_systemd_service_name }}"
    enabled: true
    daemon_reload: "{{ ldap_systemd_unit_changed | default(false) }}"
    state: >-
      {{
        'restarted'
        if ((ldap_systemd_service_restart_required | bool) and (ldap_systemd_service_active_check.rc == 0))
        else 'started'
      }}
  register: ldap_systemd_service_apply

- name: Wait for LDAP TCP listener on target host
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ ldap_listen_port }}"
    timeout: 90
