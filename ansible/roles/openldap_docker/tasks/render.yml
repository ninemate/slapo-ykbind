- name: Copy bundled schema LDIF to runtime directory
  ansible.builtin.copy:
    src: "{{ repo_root }}/schema/yubikey-otp.ldif"
    dest: "{{ ldap_runtime_schema_dir }}/yubikey-otp.ldif"
    mode: "0644"

- name: Copy optional TLS material to target host
  ansible.builtin.copy:
    src: "{{ item.src if item.src.startswith('/') else repo_root ~ '/' ~ item.src }}"
    dest: "{{ ldap_tls_host_dir }}/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - src: "{{ ldap_tls_certificate_src }}"
      dest: tls.crt
      mode: "0644"
    - src: "{{ ldap_tls_private_key_src }}"
      dest: tls.key
      mode: "0600"
    - src: "{{ ldap_tls_ca_src }}"
      dest: ca.crt
      mode: "0644"
  when:
    - ldap_enable_ldaps | bool
    - item.src | length > 0

- name: Copy additional schema LDIFs to target host
  ansible.builtin.copy:
    src: "{{ item if item.startswith('/') else repo_root ~ '/' ~ item }}"
    dest: "{{ ldap_runtime_schema_dir }}/{{ item | basename }}"
    mode: "0644"
  loop: "{{ ldap_additional_schema_ldifs }}"
  when: ldap_additional_schema_ldifs | length > 0

- name: Copy optional migration config LDIFs to target host
  ansible.builtin.copy:
    src: "{{ item if item.startswith('/') else repo_root ~ '/' ~ item }}"
    dest: "{{ ldap_runtime_config_import_dir }}/{{ item | basename }}"
    mode: "0644"
  loop: "{{ ldap_migration_config_ldifs }}"
  when: ldap_migration_config_ldifs | length > 0

- name: Render Docker Compose manifest
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ldap_compose_file }}"
    mode: "0644"

- name: Render LDAP configuration LDIF assets
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ ldap_runtime_ldif_dir }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - src: tls-config.ldif.j2
      dest: tls-config.ldif
