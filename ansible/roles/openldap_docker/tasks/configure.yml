---
- name: Discover live cn=config state before runtime configuration
  ansible.builtin.import_tasks: discover.yml

- name: Render overlay config LDIF after database discovery
  ansible.builtin.template:
    src: overlay-config.ldif.j2
    dest: "{{ ldap_runtime_ldif_dir }}/overlay-config.ldif"
    owner: "{{ ldap_runtime_uid | string }}"
    group: "{{ ldap_runtime_gid | string }}"
    mode: "0644"
  when: ldap_module_build_enabled | bool

- name: Hash admin password for rootDN reset
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - slappasswd
      - -s
      - "{{ ldap_admin_password }}"
  register: ldap_admin_password_hash_cmd
  changed_when: false
  when:
    - ldap_full_import_requested | bool
    - ldap_current_suffix != ldap_base_dn or ldap_current_rootdn != ldap_admin_dn or (ldap_force_password_reset | bool)

- name: Render database config update LDIF
  ansible.builtin.template:
    src: database-config.ldif.j2
    dest: "{{ ldap_runtime_ldif_dir }}/database-config.ldif"
    owner: "{{ ldap_runtime_uid | string }}"
    group: "{{ ldap_runtime_gid | string }}"
    mode: "0644"
  vars:
    ldap_admin_password_hash: "{{ ldap_admin_password_hash_cmd.stdout }}"
  when:
    - ldap_full_import_requested | bool
    - ldap_current_suffix != ldap_base_dn or ldap_current_rootdn != ldap_admin_dn or (ldap_force_password_reset | bool)

- name: Update LDAP suffix, rootDN and rootPW for full_import
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - ldapmodify
      - -Q
      - -Y
      - EXTERNAL
      - -H
      - ldapi:///
      - -f
      - "{{ ldap_container_bootstrap_dir }}/ldif/database-config.ldif"
  when:
    - ldap_full_import_requested | bool
    - ldap_current_suffix != ldap_base_dn or ldap_current_rootdn != ldap_admin_dn or (ldap_force_password_reset | bool)

- name: Apply optional migration config LDIFs
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - ldapmodify
      - -Q
      - -Y
      - EXTERNAL
      - -H
      - ldapi:///
      - -f
      - "{{ ldap_container_config_import_dir }}/{{ item | basename }}"
  loop: "{{ ldap_migration_config_ldifs }}"
  when: ldap_migration_config_ldifs | length > 0

- name: Import bundled YubiKey schema idempotently
  ansible.builtin.include_tasks: schema_import.yml
  vars:
    ldap_schema_import_label: bundled-yubikey
    ldap_schema_import_src_path: "{{ repo_root }}/schema/yubikey-otp.ldif"

- name: Import optional extra schema LDIF files idempotently
  ansible.builtin.include_tasks: schema_import.yml
  loop: "{{ ldap_additional_schema_ldifs }}"
  loop_control:
    loop_var: ldap_additional_schema_item
    label: "{{ ldap_additional_schema_item }}"
  vars:
    ldap_schema_import_label: "extra-{{ ldap_additional_schema_item | basename | regex_replace('\\.ldif$', '') }}"
    ldap_schema_import_src_path: "{{ ldap_additional_schema_item if ldap_additional_schema_item.startswith('/') else repo_root ~ '/' ~ ldap_additional_schema_item }}"
  when: ldap_additional_schema_ldifs | length > 0

- name: Read existing module list state
  ansible.builtin.shell: >
    docker exec {{ ldap_container_name }} sh -lc
    "ldapsearch -Q -LLL -Y EXTERNAL -H ldapi:/// -b cn=config '(objectClass=olcModuleList)'
    dn olcModulePath olcModuleLoad |
    awk '
      BEGIN { first=1 }
      /^dn: / {
        if (first) {
          sub(/^dn: /, \"\", \$0); print \"dn=\" \$0; first=0
        }
      }
      /^olcModulePath: / {
        sub(/^olcModulePath: /, \"\", \$0); print \"path=\" \$0
      }
      /^olcModuleLoad: / {
        sub(/^olcModuleLoad: /, \"\", \$0); print \"load=\" \$0
      }
    '"
  register: ldap_module_state
  changed_when: false
  when: ldap_module_build_enabled | bool

- name: Store module list facts
  ansible.builtin.set_fact:
    ldap_module_config_dn: "{{ (ldap_module_state.stdout_lines | select('match', '^dn=') | list | first | default('dn=cn=module{0},cn=config')) | regex_replace('^dn=', '') }}"
    ldap_module_config_exists: "{{ (ldap_module_state.stdout_lines | select('match', '^dn=') | list | length) > 0 }}"
    ldap_module_path_present: "{{ (ldap_module_state.stdout_lines | select('match', '^path=') | list | length) > 0 }}"
    ldap_module_loaded: "{{ ldap_container_module_name in ((ldap_module_state.stdout_lines | select('match', '^load=') | map('regex_replace', '^load=', '') | list) | join('\n')) }}"
  when: ldap_module_build_enabled | bool

- name: Render module load LDIF
  ansible.builtin.template:
    src: module-load.ldif.j2
    dest: "{{ ldap_runtime_ldif_dir }}/module-load.ldif"
    owner: "{{ ldap_runtime_uid | string }}"
    group: "{{ ldap_runtime_gid | string }}"
    mode: "0644"
  when: (ldap_module_build_enabled | bool) and not (ldap_module_loaded | default(false) | bool)

- name: Load ykbind module in cn=config
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - ldapmodify
      - -Q
      - -Y
      - EXTERNAL
      - -H
      - ldapi:///
      - -f
      - "{{ ldap_container_bootstrap_dir }}/ldif/module-load.ldif"
  when: (ldap_module_build_enabled | bool) and not (ldap_module_loaded | default(false) | bool)

- name: Check whether ykbind overlay is already configured
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - ldapsearch
      - -Q
      - -Y
      - EXTERNAL
      - -H
      - ldapi:///
      - -LLL
      - -b
      - "{{ ldap_database_config_dn }}"
      - "(olcOverlay=ykbind)"
      - dn
  register: ldap_overlay_check
  changed_when: false
  when: ldap_module_build_enabled | bool

- name: Configure ykbind overlay on the main database
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - ldapadd
      - -Q
      - -Y
      - EXTERNAL
      - -H
      - ldapi:///
      - -f
      - "{{ ldap_container_bootstrap_dir }}/ldif/overlay-config.ldif"
  when: "(ldap_module_build_enabled | bool) and ('dn: ' not in (ldap_overlay_check.stdout | default('')))"

- name: Check that TLS files exist on the target host
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ ldap_tls_host_dir }}/tls.crt"
    - "{{ ldap_tls_host_dir }}/tls.key"
    - "{{ ldap_tls_host_dir }}/ca.crt"
  register: ldap_tls_file_stats
  when: ldap_enable_ldaps | bool

- name: Fail when LDAPS is enabled but TLS files are missing
  ansible.builtin.fail:
    msg: "LDAPS engedélyezve van, de hiányzik legalább egy fájl a {{ ldap_tls_host_dir }} könyvtárból."
  when: (ldap_enable_ldaps | bool) and (ldap_tls_file_stats.results | default([]) | selectattr('stat.exists', 'equalto', false) | list | length > 0)

- name: Read current TLS configuration
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - ldapsearch
      - -Q
      - -Y
      - EXTERNAL
      - -H
      - ldapi:///
      - -LLL
      - -b
      - cn=config
      - -s
      - base
      - "(objectClass=*)"
      - olcTLSCACertificateFile
      - olcTLSCertificateFile
      - olcTLSCertificateKeyFile
  register: ldap_tls_config_check
  changed_when: false
  when: ldap_enable_ldaps | bool

- name: Configure TLS paths in cn=config
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - ldapmodify
      - -Q
      - -Y
      - EXTERNAL
      - -H
      - ldapi:///
      - -f
      - "{{ ldap_container_bootstrap_dir }}/ldif/tls-config.ldif"
  when: (ldap_enable_ldaps | bool) and (ldap_tls_cert_file not in (ldap_tls_config_check.stdout | default('')) or ldap_tls_key_file not in (ldap_tls_config_check.stdout | default('')) or ldap_tls_ca_file not in (ldap_tls_config_check.stdout | default('')))
