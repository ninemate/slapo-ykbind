---
- name: Wait until the RADIUS container is running
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{.State.Running}}' }}"
      - "{{ radius_container_name }}"
  register: radius_container_running_check
  changed_when: false
  retries: 20
  delay: 3
  until: radius_container_running_check.stdout | trim == 'true'

- name: Smoke test FreeRADIUS config syntax inside the container
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ radius_container_name }}"
      - freeradius
      - -CX
      - -d
      - "{{ radius_container_config_dir }}"
  register: radius_config_syntax_check
  changed_when: false

- name: Smoke test RADIUS daemon process presence
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ radius_container_name }}"
      - sh
      - -c
      - "pgrep -x freeradius >/dev/null 2>&1 || pgrep -x radiusd >/dev/null 2>&1"
  register: radius_process_check
  changed_when: false

- name: Smoke test LDAP reachability from the RADIUS container
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - LDAPTLS_REQCERT=never
      - "{{ radius_container_name }}"
      - ldapwhoami
      - -x
      - -D
      - "{{ radius_ldap_bind_dn }}"
      - -w
      - "{{ radius_ldap_bind_password }}"
      - -H
      - "{{ radius_container_healthcheck_ldap_uri_effective }}"
  register: radius_ldap_smoke_check
  changed_when: false
  when:
    - radius_ldap_bind_dn | length > 0
    - radius_ldap_bind_password | length > 0

- name: Smoke test managed dynamic client config presence
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ radius_container_name }}"
      - sh
      - -c
      - "grep -q 'server {{ radius_dynamic_client_server_name }}' '{{ radius_container_config_dir }}/clients.conf' && grep -q '{{ radius_clients_base_dn }}' '{{ radius_container_config_dir }}/clients.conf'"
  register: radius_dynamic_clients_config_check
  changed_when: false
  when: radius_dynamic_client_networks | length > 0

- name: Smoke test PAP auth path with radtest against localhost listener
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ radius_container_name }}"
      - sh
      - -c
      - "radtest '{{ radius_test_username }}' '{{ radius_test_password_otp }}' '127.0.0.1:{{ radius_container_auth_port }}' 0 testing123 2>&1 | grep -q 'Access-Accept'"
  register: radius_pap_smoke_test
  changed_when: false
  when:
    - radius_test_username | length > 0
    - radius_test_password_otp | length > 0
