---
- name: Derive effective input values
  ansible.builtin.import_tasks: derive_inputs.yml

- name: Build image on control node
  ansible.builtin.import_tasks: local_build.yml

- name: Install host prerequisites
  ansible.builtin.import_tasks: prerequisites.yml

- name: Validate target host state for selected mode
  ansible.builtin.import_tasks: precheck.yml

- name: Reset target before requested full import
  ansible.builtin.import_tasks: reset.yml

- name: Create deploy directories
  ansible.builtin.import_tasks: directories.yml

- name: Render Docker and LDIF assets
  ansible.builtin.import_tasks: render.yml

- name: Build image and start container
  ansible.builtin.import_tasks: build_and_run.yml

- name: Configure LDAP server
  ansible.builtin.import_tasks: configure.yml
  when: ldap_full_import_requested | bool

- name: Adopt existing LDAP state
  ansible.builtin.import_tasks: adopt_existing.yml
  when: ldap_adopt_existing_mode | bool

- name: Run full import tasks
  ansible.builtin.import_tasks: import.yml
  when: ldap_full_import_requested | bool

- name: Run smoke tests
  ansible.builtin.import_tasks: verify.yml
