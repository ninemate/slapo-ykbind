---
- name: Install Docker packages on Debian hosts
  ansible.builtin.apt:
    name: "{{ ldap_host_packages }}"
    state: present
    update_cache: true
  when:
    - ldap_manage_host_packages
    - ansible_facts.os_family == "Debian"

- name: Ensure Docker daemon is running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

