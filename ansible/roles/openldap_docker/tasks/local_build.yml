---
- name: Create local image build directories on control node
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ldap_local_artifact_root }}"
    - "{{ ldap_local_build_context_dir }}"
    - "{{ ldap_local_build_context_dir }}/module"
    - "{{ ldap_local_build_context_dir }}/module/patches"
  delegate_to: localhost
  become: false
  run_once: true

- name: Copy Docker build assets to control node
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - src: "{{ repo_root }}/docker/openldap/Dockerfile"
      dest: "{{ ldap_local_build_context_dir }}/Dockerfile"
    - src: "{{ repo_root }}/docker/openldap/entrypoint.sh"
      dest: "{{ ldap_local_build_context_dir }}/entrypoint.sh"
      mode: "0755"
    - src: "{{ role_path }}/files/noCheckValidUntil"
      dest: "{{ ldap_local_build_context_dir }}/noCheckValidUntil"
    - src: "{{ role_path }}/files/syslog-ng.conf"
      dest: "{{ ldap_local_build_context_dir }}/syslog-ng.conf"
    - src: "{{ role_path }}/files/healthcheck.sh"
      dest: "{{ ldap_local_build_context_dir }}/healthcheck.sh"
      mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

- name: Copy overlay module source files to local build context
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - src: "{{ repo_root }}/Makefile"
      dest: "{{ ldap_local_build_context_dir }}/module/Makefile"
    - src: "{{ repo_root }}/slapo-ykbind.c"
      dest: "{{ ldap_local_build_context_dir }}/module/slapo-ykbind.c"
    - src: "{{ repo_root }}/patches/openldap-2.6.10-sasl-getconfpath-guard.patch"
      dest: "{{ ldap_local_build_context_dir }}/module/patches/openldap-2.6.10-sasl-getconfpath-guard.patch"
  delegate_to: localhost
  become: false
  run_once: true

- name: Verify Docker is available on control node
  ansible.builtin.command:
    argv:
      - docker
      - version
  register: ldap_local_docker_version
  changed_when: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Remove previous local docker build log
  ansible.builtin.file:
    path: "{{ ldap_local_build_log }}"
    state: absent
  delegate_to: localhost
  become: false
  run_once: true

- name: Start OpenLDAP image build on control node with live log capture
  ansible.builtin.shell: |
    set -o pipefail
    docker build --progress=plain \
      --network "{{ ldap_docker_build_network }}" \
      -t "{{ ldap_image_name }}" \
      --build-arg "BASE_IMAGE={{ ldap_container_base_image }}" \
      --build-arg "http_proxy={{ ldap_proxy_env.http_proxy | default(ldap_http_proxy) }}" \
      --build-arg "https_proxy={{ ldap_proxy_env.https_proxy | default(ldap_https_proxy) }}" \
      --build-arg "no_proxy={{ ldap_proxy_env.no_proxy | default(ldap_no_proxy) }}" \
      --build-arg "HTTP_PROXY={{ ldap_proxy_env.http_proxy | default(ldap_http_proxy) }}" \
      --build-arg "HTTPS_PROXY={{ ldap_proxy_env.https_proxy | default(ldap_https_proxy) }}" \
      --build-arg "NO_PROXY={{ ldap_proxy_env.no_proxy | default(ldap_no_proxy) }}" \
      --build-arg "LDAP_MODULE_BUILD_ENABLED={{ (ldap_module_build_enabled | bool) | ternary('true', 'false') }}" \
      "{{ ldap_local_build_context_dir }}" 2>&1 | tee "{{ ldap_local_build_log }}"
  args:
    executable: /bin/bash
  register: ldap_local_build_async
  async: "{{ ldap_local_build_async_timeout }}"
  poll: 0
  environment:
    http_proxy: "{{ ldap_proxy_env.http_proxy | default(ldap_http_proxy) }}"
    https_proxy: "{{ ldap_proxy_env.https_proxy | default(ldap_https_proxy) }}"
    no_proxy: "{{ ldap_proxy_env.no_proxy | default(ldap_no_proxy) }}"
    HTTP_PROXY: "{{ ldap_proxy_env.http_proxy | default(ldap_http_proxy) }}"
    HTTPS_PROXY: "{{ ldap_proxy_env.https_proxy | default(ldap_https_proxy) }}"
    NO_PROXY: "{{ ldap_proxy_env.no_proxy | default(ldap_no_proxy) }}"
    DOCKER_BUILDKIT: "1"
    BUILDKIT_PROGRESS: plain
  delegate_to: localhost
  become: false
  run_once: true

- name: Initialize local build polling facts
  ansible.builtin.set_fact:
    ldap_local_build_finished: false
    ldap_local_build_log_line_count: 0
    ldap_local_build_result_rc: -1
  run_once: true

- name: Poll local build and print new output
  ansible.builtin.include_tasks: local_build_poll.yml
  loop: "{{ range(0, ldap_local_build_max_polls | int) | list }}"
  loop_control:
    loop_var: poll_idx
  when: not (ldap_local_build_finished | default(false))
  run_once: true

- name: Fail when local docker build did not finish before timeout
  ansible.builtin.fail:
    msg: "A docker build nem fejeződött be a megadott időn belül. Log: {{ ldap_local_build_log }}"
  when: not (ldap_local_build_finished | default(false))
  run_once: true

- name: Fail when local docker build returned non-zero
  ansible.builtin.fail:
    msg: "A docker build hibával állt le. Log: {{ ldap_local_build_log }}"
  when: (ldap_local_build_result_rc | int) != 0
  run_once: true

- name: Inspect local image size before export
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ ldap_image_name }}"
      - --format
      - "{{ '{{.Size}}' }}"
  register: ldap_local_image_size_cmd
  changed_when: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Remove previous local image archive
  ansible.builtin.file:
    path: "{{ ldap_local_image_archive }}"
    state: absent
  delegate_to: localhost
  become: false
  run_once: true

- name: Start image tarball export on control node
  ansible.builtin.command:
    argv:
      - docker
      - save
      - -o
      - "{{ ldap_local_image_archive }}"
      - "{{ ldap_image_name }}"
  register: ldap_local_save_async
  async: "{{ ldap_local_save_async_timeout }}"
  poll: 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Initialize local save polling facts
  ansible.builtin.set_fact:
    ldap_local_image_expected_size: "{{ ldap_local_image_size_cmd.stdout | int }}"
    ldap_local_save_finished: false
    ldap_local_save_prev_size: 0
    ldap_local_save_result_rc: -1
  run_once: true

- name: Poll local image export and print progress
  ansible.builtin.include_tasks: local_save_poll.yml
  loop: "{{ range(0, ldap_local_save_max_polls | int) | list }}"
  loop_control:
    loop_var: save_poll_idx
  when: not (ldap_local_save_finished | default(false))
  run_once: true

- name: Fail when local image export did not finish before timeout
  ansible.builtin.fail:
    msg: "A docker save nem fejeződött be a megadott időn belül. Archive: {{ ldap_local_image_archive }}"
  when: not (ldap_local_save_finished | default(false))
  run_once: true

- name: Fail when local image export returned non-zero
  ansible.builtin.fail:
    msg: "A docker save hibával állt le. Archive: {{ ldap_local_image_archive }}"
  when: (ldap_local_save_result_rc | int) != 0
  run_once: true
