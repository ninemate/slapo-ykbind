---
- name: Create local image build directories on control node
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ldap_local_artifact_root }}"
    - "{{ ldap_local_build_context_dir }}"
    - "{{ ldap_local_build_context_dir }}/module"
    - "{{ ldap_local_build_context_dir }}/module/patches"
  delegate_to: localhost
  become: false
  run_once: true

- name: Copy Docker build assets to control node
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - src: "{{ repo_root }}/docker/openldap/Dockerfile"
      dest: "{{ ldap_local_build_context_dir }}/Dockerfile"
    - src: "{{ repo_root }}/docker/openldap/entrypoint.sh"
      dest: "{{ ldap_local_build_context_dir }}/entrypoint.sh"
      mode: "0755"
    - src: "{{ role_path }}/files/noCheckValidUntil"
      dest: "{{ ldap_local_build_context_dir }}/noCheckValidUntil"
    - src: "{{ role_path }}/files/syslog-ng.conf"
      dest: "{{ ldap_local_build_context_dir }}/syslog-ng.conf"
    - src: "{{ role_path }}/files/healthcheck.sh"
      dest: "{{ ldap_local_build_context_dir }}/healthcheck.sh"
      mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

- name: Copy overlay module source files to local build context
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - src: "{{ repo_root }}/Makefile"
      dest: "{{ ldap_local_build_context_dir }}/module/Makefile"
    - src: "{{ repo_root }}/slapo-ykbind.c"
      dest: "{{ ldap_local_build_context_dir }}/module/slapo-ykbind.c"
    - src: "{{ repo_root }}/patches/openldap-2.6.10-sasl-getconfpath-guard.patch"
      dest: "{{ ldap_local_build_context_dir }}/module/patches/openldap-2.6.10-sasl-getconfpath-guard.patch"
  delegate_to: localhost
  become: false
  run_once: true

- name: Verify Docker is available on control node
  ansible.builtin.command:
    argv:
      - docker
      - version
  register: ldap_local_docker_version
  changed_when: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Check whether the local image already exists on control node
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ ldap_image_name }}"
  register: ldap_local_existing_image_check
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail when local build is skipped but image is missing
  ansible.builtin.fail:
    msg: "A ldap_skip_local_build=true, de a lokális image nem létezik: {{ ldap_image_name }}"
  when:
    - ldap_skip_local_build | bool
    - ldap_local_existing_image_check.rc != 0
  run_once: true

- name: Announce local image build skip
  ansible.builtin.debug:
    msg: "Skipping local docker build because ldap_skip_local_build=true and image {{ ldap_image_name }} already exists."
  when:
    - ldap_skip_local_build | bool
    - ldap_local_existing_image_check.rc == 0
  run_once: true

- name: Remove previous local docker build log
  ansible.builtin.file:
    path: "{{ ldap_local_build_log }}"
    state: absent
  delegate_to: localhost
  become: false
  run_once: true
  when: not (ldap_skip_local_build | bool)

- name: Build OpenLDAP image on control node
  ansible.builtin.shell: |
    set -o pipefail
    docker build --progress=plain \
      --network "{{ ldap_docker_build_network }}" \
      -t "{{ ldap_image_name }}" \
      --build-arg "BASE_IMAGE={{ ldap_container_base_image }}" \
      --build-arg "http_proxy={{ ldap_proxy_env.http_proxy | default(ldap_http_proxy) }}" \
      --build-arg "https_proxy={{ ldap_proxy_env.https_proxy | default(ldap_https_proxy) }}" \
      --build-arg "no_proxy={{ ldap_proxy_env.no_proxy | default(ldap_no_proxy) }}" \
      --build-arg "HTTP_PROXY={{ ldap_proxy_env.http_proxy | default(ldap_http_proxy) }}" \
      --build-arg "HTTPS_PROXY={{ ldap_proxy_env.https_proxy | default(ldap_https_proxy) }}" \
      --build-arg "NO_PROXY={{ ldap_proxy_env.no_proxy | default(ldap_no_proxy) }}" \
      --build-arg "LDAP_MODULE_BUILD_ENABLED={{ (ldap_module_build_enabled | bool) | ternary('true', 'false') }}" \
      "{{ ldap_local_build_context_dir }}" 2>&1 | tee "{{ ldap_local_build_log }}"
  args:
    executable: /bin/bash
  register: ldap_local_docker_build
  changed_when: true
  environment:
    http_proxy: "{{ ldap_proxy_env.http_proxy | default(ldap_http_proxy) }}"
    https_proxy: "{{ ldap_proxy_env.https_proxy | default(ldap_https_proxy) }}"
    no_proxy: "{{ ldap_proxy_env.no_proxy | default(ldap_no_proxy) }}"
    HTTP_PROXY: "{{ ldap_proxy_env.http_proxy | default(ldap_http_proxy) }}"
    HTTPS_PROXY: "{{ ldap_proxy_env.https_proxy | default(ldap_https_proxy) }}"
    NO_PROXY: "{{ ldap_proxy_env.no_proxy | default(ldap_no_proxy) }}"
    DOCKER_BUILDKIT: "1"
    BUILDKIT_PROGRESS: plain
  delegate_to: localhost
  become: false
  run_once: true
  when: not (ldap_skip_local_build | bool)

- name: Explain local image archive export
  ansible.builtin.debug:
    msg: "Starting docker save to {{ ldap_local_image_archive }}. This step can be silent for a while on large images."
  when: not (ldap_skip_local_save | bool)
  run_once: true

- name: Inspect local image size before export
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ ldap_image_name }}"
      - --format
      - "{{ '{{.Size}}' }}"
  register: ldap_local_image_size_cmd
  changed_when: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail when local save is skipped but archive is missing
  ansible.builtin.stat:
    path: "{{ ldap_local_image_archive }}"
  register: ldap_local_archive_stat
  delegate_to: localhost
  become: false
  run_once: true
  when: ldap_skip_local_save | bool

- name: Announce local image archive export skip
  ansible.builtin.debug:
    msg: "Skipping local docker save because ldap_skip_local_save=true and archive {{ ldap_local_image_archive }} already exists."
  when:
    - ldap_skip_local_save | bool
    - ldap_local_archive_stat.stat.exists | default(false)
  run_once: true

- name: Fail when local save is skipped but archive does not exist
  ansible.builtin.fail:
    msg: "A ldap_skip_local_save=true, de a lokális archive nem létezik: {{ ldap_local_image_archive }}"
  when:
    - ldap_skip_local_save | bool
    - not (ldap_local_archive_stat.stat.exists | default(false))
  run_once: true

- name: Remove previous local image archive
  ansible.builtin.file:
    path: "{{ ldap_local_image_archive }}"
    state: absent
  delegate_to: localhost
  become: false
  run_once: true
  when: not (ldap_skip_local_save | bool)

- name: Export image tarball on control node
  ansible.builtin.command:
    argv:
      - docker
      - save
      - -o
      - "{{ ldap_local_image_archive }}"
      - "{{ ldap_image_name }}"
  register: ldap_local_docker_save
  changed_when: true
  delegate_to: localhost
  become: false
  run_once: true
  when: not (ldap_skip_local_save | bool)

- name: Show exported image archive details
  ansible.builtin.stat:
    path: "{{ ldap_local_image_archive }}"
  register: ldap_local_image_archive_stat_after_save
  delegate_to: localhost
  become: false
  run_once: true

- name: Report local image archive result
  ansible.builtin.debug:
    msg: >-
      Local image archive ready at {{ ldap_local_image_archive }}
      ({{ (ldap_local_image_archive_stat_after_save.stat.size | default(0) | int) | human_readable }}).
  when: ldap_local_image_archive_stat_after_save.stat.exists | default(false)
  run_once: true
