---
- name: Filter unsupported entries from full-tree LDIF on control node
  ansible.builtin.shell: |
    set -euo pipefail
    "{{ repo_root }}/tools/filter-unsupported-ldif.sh" \
      --output "{{ ldap_local_artifact_root }}/full-tree.filtered.ldif" \
    {% for subtree in ldap_ldif_drop_subtrees %}
      --drop-subtree "{{ subtree }}" \
    {% endfor %}
    {% for objectclass in ldap_ldif_drop_objectclasses %}
      --drop-objectclass "{{ objectclass }}" \
    {% endfor %}
      "{{ ldap_ldif_import_src_path }}"
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
  when: ldap_ldif_filter_enabled | bool

- name: Select effective full-tree LDIF source
  ansible.builtin.set_fact:
    ldap_effective_ldif_import_src_path: "{{ (ldap_ldif_filter_enabled | bool) | ternary(ldap_local_artifact_root ~ '/full-tree.filtered.ldif', ldap_ldif_import_src_path) }}"

- name: Copy full tree LDIF to target host
  ansible.builtin.copy:
    src: "{{ ldap_effective_ldif_import_src_path }}"
    dest: "{{ ldap_runtime_import_dir }}/full-tree.ldif"
    mode: "0644"

- name: Check whether the base DN already exists before full restore
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - ldapsearch
      - -x
      - -D
      - "{{ ldap_admin_dn }}"
      - -w
      - "{{ ldap_admin_password }}"
      - -H
      - ldap://127.0.0.1
      - -LLL
      - -b
      - "{{ ldap_base_dn }}"
      - -s
      - base
      - "(objectClass=*)"
      - dn
  register: ldap_full_restore_base_precheck
  changed_when: false
  failed_when: false

- name: Stop full restore when the target tree is not empty
  ansible.builtin.fail:
    msg: >-
      Full-tree restore needs a virgin target database, but ldapsearch found
      {{ ldap_base_dn }} before slapadd. Precheck output:
      {{ ldap_full_restore_base_precheck.stdout | default('') }}.
      The persistent bind-mount directories are data={{ ldap_data_dir }} and
      config={{ ldap_config_dir }} under deploy_root={{ ldap_deploy_root }}.
      In full_import mode those directories are automatically recreated before
      container start, so this indicates that some earlier step still created
      data in the target DB. Investigate the mode-specific configure tasks.
  when:
    - "'dn: ' in (ldap_full_restore_base_precheck.stdout | default(''))"

- name: Stop OpenLDAP container before offline full tree restore
  ansible.builtin.command:
    argv:
      - docker
      - stop
      - "{{ ldap_container_name }}"

- name: Import full tree LDIF with offline slapadd
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --volumes-from
      - "{{ ldap_container_name }}"
      - --entrypoint
      - slapadd
      - "{{ ldap_image_name }}"
      - -F
      - /etc/ldap/slapd.d
      - -n
      - "1"
      - -l
      - "{{ ldap_container_bootstrap_dir }}/ldif/imports/full-tree.ldif"

- name: Fix LDAP DB ownership after offline slapadd
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --volumes-from
      - "{{ ldap_container_name }}"
      - --entrypoint
      - chown
      - "{{ ldap_image_name }}"
      - -R
      - openldap:openldap
      - /var/lib/ldap

- name: Start OpenLDAP container after full tree restore
  ansible.builtin.command:
    argv:
      - docker-compose
      - -f
      - "{{ ldap_compose_file }}"
      - up
      - -d
    chdir: "{{ ldap_deploy_root }}"

- name: Wait for LDAP TCP listener after full restore
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ ldap_listen_port }}"
    timeout: 90
