---
- name: Filter unsupported entries from full-tree LDIF on control node
  ansible.builtin.shell: |
    set -euo pipefail
    "{{ repo_root }}/tools/filter-unsupported-ldif.sh" \
      --output "{{ ldap_local_artifact_root }}/full-tree.filtered.ldif" \
    {% for subtree in ldap_ldif_drop_subtrees %}
      --drop-subtree "{{ subtree }}" \
    {% endfor %}
    {% for objectclass in ldap_ldif_drop_objectclasses %}
      --drop-objectclass "{{ objectclass }}" \
    {% endfor %}
      "{{ ldap_ldif_import_src_path }}"
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
  when: ldap_ldif_filter_enabled | bool

- name: Select effective full-tree LDIF source
  ansible.builtin.set_fact:
    ldap_effective_ldif_import_src_path: "{{ (ldap_ldif_filter_enabled | bool) | ternary(ldap_local_artifact_root ~ '/full-tree.filtered.ldif', ldap_ldif_import_src_path) }}"

- name: Copy full tree LDIF to target host
  ansible.builtin.copy:
    src: "{{ ldap_effective_ldif_import_src_path }}"
    dest: "{{ ldap_runtime_import_dir }}/full-tree.ldif"
    mode: "0644"

- name: Stop OpenLDAP container before schema injection
  ansible.builtin.systemd_service:
    name: "{{ ldap_systemd_service_name }}"
    state: stopped

- name: Write extra schema files directly to slapd.d config directory
  ansible.builtin.shell: |
    set -euo pipefail
    schema_dir="{{ ldap_config_dir }}/cn=config/cn=schema"
    [ -d "$schema_dir" ] || exit 0
    # Find next available slot number
    next_n=0
    for f in "$schema_dir"/cn={*}.ldif; do
      [ -f "$f" ] || continue
      n="${f##*cn=\{}"; n="${n%%\}*}"
      [ "$n" -gt "$next_n" ] 2>/dev/null && next_n="$n"
    done
    next_n=$((next_n + 1))
    # Process each extra schema file
    for infile in "{{ ldap_runtime_schema_dir }}"/*.ldif; do
      b="$(basename "$infile")"
      [ "$b" = "yubikey-otp.ldif" ] && continue
      [ -f "$infile" ] || continue
      awk -v n="$next_n" '
      BEGIN { RS=""; ORS="\n\n" }
      {
        # Extract schema name from cn or dn
        name = ""
        if (match($0, /^cn:[ \t]*\{[0-9]+\}?([^\n]+)/)) name = substr($0, RSTART+3, RLENGTH-3)
        else if (match($0, /^dn: cn=\{?[0-9]*\}?([^,]+)/)) name = substr($0, RSTART+3, RLENGTH-3)
        gsub(/^\{[0-9]+\}/, "", name)
        gsub(/,.*/, "", name)
        gsub(/^[ \t]+|[ \t]+$/, "", name)
        if (name ~ /^(core|cosine|nis|inetorgperson|schema)$/) next
        if (length(name) == 0) name = "extra-" n
        # Add objectClass if missing
        if (!/objectClass:/) gsub(/^dn:[^\n]*/, "&\nobjectClass: olcSchemaConfig")
        # Replace {N} with new number in dn/cn
        gsub(/\{[0-9]+\}/, "{" n "}", $0)
        # Write to slapd.d schema directory
        outfile = "'"$schema_dir"'/cn={" n "}" name ".ldif"
        print > outfile
        n++
      }' "$infile"
    done
  args:
    executable: /bin/bash
  when: ldap_additional_schema_ldifs | length > 0

- name: Start OpenLDAP container after schema injection
  ansible.builtin.systemd_service:
    name: "{{ ldap_systemd_service_name }}"
    state: started

- name: Wait for LDAP TCP listener after schema injection
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ ldap_listen_port }}"
    timeout: 90

- name: Import full tree LDIF online with ldapadd -c
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - ldapadd
      - -c
      - -x
      - -D
      - "{{ ldap_admin_dn }}"
      - -w
      - "{{ ldap_admin_password }}"
      - -H
      - "{{ ldap_container_internal_ldap_uri }}"
      - -f
      - "{{ ldap_container_bootstrap_dir }}/ldif/imports/full-tree.ldif"
  register: ldap_online_import_result
  failed_when: false
