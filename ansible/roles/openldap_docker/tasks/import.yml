---
- name: Copy optional bootstrap LDIF to target host
  ansible.builtin.copy:
    src: "{{ ldap_bootstrap_ldif_file if ldap_bootstrap_ldif_file.startswith('/') else repo_root ~ '/' ~ ldap_bootstrap_ldif_file }}"
    dest: "{{ ldap_runtime_import_dir }}/bootstrap.ldif"
    mode: "0644"
  when: ldap_bootstrap_ldif_file | length > 0

- name: Check bootstrap LDIF marker
  ansible.builtin.stat:
    path: "{{ ldap_bootstrap_import_marker }}"
  register: ldap_bootstrap_import_marker_stat
  when: ldap_bootstrap_ldif_file | length > 0

- name: Import bootstrap LDIF once
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - ldapadd
      - -c
      - -x
      - -D
      - "{{ ldap_admin_dn }}"
      - -w
      - "{{ ldap_admin_password }}"
      - -H
      - ldap://127.0.0.1
      - -f
      - "{{ ldap_container_bootstrap_dir }}/ldif/imports/bootstrap.ldif"
  when: ldap_bootstrap_ldif_file | length > 0 and not (ldap_bootstrap_import_marker_stat.stat.exists | default(false))

- name: Mark bootstrap LDIF import as done
  ansible.builtin.file:
    path: "{{ ldap_bootstrap_import_marker }}"
    state: touch
    mode: "0644"
  when: ldap_bootstrap_ldif_file | length > 0 and not (ldap_bootstrap_import_marker_stat.stat.exists | default(false))

- name: Require LDIF path when full import is enabled
  ansible.builtin.assert:
    that:
      - ldap_ldif_import_file | length > 0
    fail_msg: "A teljes tree import engedélyezett, de a ldap_ldif_import_file nincs megadva."
  when: ldap_ldif_import_enabled

- name: Copy full tree LDIF to target host
  ansible.builtin.copy:
    src: "{{ ldap_ldif_import_file if ldap_ldif_import_file.startswith('/') else repo_root ~ '/' ~ ldap_ldif_import_file }}"
    dest: "{{ ldap_runtime_import_dir }}/full-tree.ldif"
    mode: "0644"
  when: ldap_ldif_import_enabled

- name: Check full tree import marker
  ansible.builtin.stat:
    path: "{{ ldap_full_import_marker }}"
  register: ldap_full_import_marker_stat
  when: ldap_ldif_import_enabled

- name: Check whether the directory already has child entries before full restore
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - ldapsearch
      - -x
      - -D
      - "{{ ldap_admin_dn }}"
      - -w
      - "{{ ldap_admin_password }}"
      - -H
      - ldap://127.0.0.1
      - -LLL
      - -b
      - "{{ ldap_base_dn }}"
      - -s
      - one
      - "(objectClass=*)"
      - dn
  register: ldap_full_restore_precheck
  changed_when: false
  failed_when: false
  when: ldap_ldif_import_enabled and not (ldap_full_import_marker_stat.stat.exists | default(false))

- name: Stop full restore on non-empty trees unless forced
  ansible.builtin.fail:
    msg: "A teljes tree restore csak üres LDAP tree-re javasolt. Állítsd true-ra a ldap_force_full_import változót, ha felül akarod írni ezt a védelmet."
  when: "ldap_ldif_import_enabled and not (ldap_full_import_marker_stat.stat.exists | default(false)) and not ldap_force_full_import and 'dn: ' in (ldap_full_restore_precheck.stdout | default(''))"

- name: Import full tree LDIF once
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - ldapadd
      - -c
      - -x
      - -D
      - "{{ ldap_admin_dn }}"
      - -w
      - "{{ ldap_admin_password }}"
      - -H
      - ldap://127.0.0.1
      - -f
      - "{{ ldap_container_bootstrap_dir }}/ldif/imports/full-tree.ldif"
  when: ldap_ldif_import_enabled and not (ldap_full_import_marker_stat.stat.exists | default(false))

- name: Mark full tree import as done
  ansible.builtin.file:
    path: "{{ ldap_full_import_marker }}"
    state: touch
    mode: "0644"
  when: ldap_ldif_import_enabled and not (ldap_full_import_marker_stat.stat.exists | default(false))
