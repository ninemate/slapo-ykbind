---
- name: Filter unsupported entries from full-tree LDIF on control node
  ansible.builtin.shell: |
    set -euo pipefail
    "{{ repo_root }}/tools/filter-unsupported-ldif.sh" \
      --output "{{ ldap_local_artifact_root }}/full-tree.filtered.ldif" \
    {% for subtree in ldap_ldif_drop_subtrees %}
      --drop-subtree "{{ subtree }}" \
    {% endfor %}
    {% for objectclass in ldap_ldif_drop_objectclasses %}
      --drop-objectclass "{{ objectclass }}" \
    {% endfor %}
      "{{ ldap_ldif_import_src_path }}"
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
  when: ldap_ldif_filter_enabled | bool

- name: Select effective full-tree LDIF source
  ansible.builtin.set_fact:
    ldap_effective_ldif_import_src_path: "{{ (ldap_ldif_filter_enabled | bool) | ternary(ldap_local_artifact_root ~ '/full-tree.filtered.ldif', ldap_ldif_import_src_path) }}"

- name: Copy full tree LDIF to target host
  ansible.builtin.copy:
    src: "{{ ldap_effective_ldif_import_src_path }}"
    dest: "{{ ldap_runtime_import_dir }}/full-tree.ldif"
    mode: "0644"

- name: Check whether the base DN already exists before full restore
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ldap_container_name }}"
      - ldapsearch
      - -x
      - -D
      - "{{ ldap_admin_dn }}"
      - -w
      - "{{ ldap_admin_password }}"
      - -H
      - "{{ ldap_container_internal_ldap_uri }}"
      - -LLL
      - -b
      - "{{ ldap_base_dn }}"
      - -s
      - base
      - "(objectClass=*)"
      - dn
  register: ldap_full_restore_base_precheck
  changed_when: false
  failed_when: false

- name: Stop full restore when the target tree is not empty
  ansible.builtin.fail:
    msg: >-
      Full-tree restore needs a virgin target database, but ldapsearch found
      {{ ldap_base_dn }} before slapadd. Precheck output:
      {{ ldap_full_restore_base_precheck.stdout | default('') }}.
      The persistent bind-mount directories are data={{ ldap_data_dir }} and
      config={{ ldap_config_dir }} under deploy_root={{ ldap_deploy_root }}.
      In full_import mode those directories are automatically recreated before
      container start, so this indicates that some earlier step still created
      data in the target DB. Investigate the mode-specific configure tasks.
  when:
    - "'dn: ' in (ldap_full_restore_base_precheck.stdout | default(''))"

- name: Stop OpenLDAP container before offline full tree restore
  ansible.builtin.systemd_service:
    name: "{{ ldap_systemd_service_name }}"
    state: stopped

- name: Import extra schema LDIFs directly into slapd config with slapadd -n 0
  ansible.builtin.shell: |
    set -euo pipefail
    for f in "{{ ldap_runtime_schema_dir }}"/*.ldif; do
      [ -f "$f" ] || continue
      b="$(basename "$f")"
      # Skip bundled yubikey schema (already handled by configure.yml)
      [ "$b" = "yubikey-otp.ldif" ] && continue
      echo "Importing extra schema: $f"
      # Fix missing objectClass for ldapsearch exports that lack it
      awk 'BEGIN{RS="";ORS="\n\n"} /^dn:/ && !/objectClass:/ {gsub(/^dn:[^\n]*/, "&\nobjectClass: olcSchemaConfig")} 1' "$f" \
        > "/tmp/fixed-${b}"
      docker run --rm \
        -v "{{ ldap_config_dir }}:/etc/ldap/slapd.d" \
        -v "/tmp/fixed-${b}:/tmp/schema.ldif:ro" \
        --entrypoint slapadd \
        "{{ ldap_image_name }}" \
        -F /etc/ldap/slapd.d \
        -n 0 \
        -c \
        -l /tmp/schema.ldif 2>&1 || true
      rm -f "/tmp/fixed-${b}"
    done
  args:
    executable: /bin/bash
  when: ldap_additional_schema_ldifs | length > 0

- name: Build offline slapadd command line
  ansible.builtin.set_fact:
    ldap_offline_slapadd_argv: >-
      {{
        [
          'docker',
          'run',
          '--rm',
          '-v', ldap_data_dir ~ ':/var/lib/ldap',
          '-v', ldap_config_dir ~ ':/etc/ldap/slapd.d',
          '-v', ldap_runtime_ldif_dir ~ ':' ~ ldap_container_bootstrap_dir ~ '/ldif:ro',
          '-v', ldap_runtime_schema_dir ~ ':' ~ ldap_container_bootstrap_dir ~ '/schema:ro',
          '--entrypoint',
          'slapadd',
          ldap_image_name,
          '-F',
          '/etc/ldap/slapd.d',
          '-n',
          '1',
          '-w'
        ]
        + ((ldap_mirrormode_enabled | bool) | ternary(['-S', ldap_server_id | string], []))
        + [
          '-l',
          ldap_container_bootstrap_dir ~ '/ldif/imports/full-tree.ldif'
        ]
      }}

- name: Import full tree LDIF with offline slapadd
  ansible.builtin.command:
    argv: "{{ ldap_offline_slapadd_argv }}"

- name: Fix LDAP DB ownership after offline slapadd
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - '-v'
      - "{{ ldap_data_dir }}:/var/lib/ldap"
      - '-v'
      - "{{ ldap_config_dir }}:/etc/ldap/slapd.d"
      - '-v'
      - "{{ ldap_log_dir }}:/var/log/slapd"
      - --entrypoint
      - chown
      - "{{ ldap_image_name }}"
      - -R
      - "{{ ldap_runtime_user }}:{{ ldap_runtime_group }}"
      - /var/lib/ldap
      - /etc/ldap/slapd.d
      - /var/log/slapd

- name: Start OpenLDAP container after full tree restore
  ansible.builtin.systemd_service:
    name: "{{ ldap_systemd_service_name }}"
    state: started

- name: Wait for LDAP TCP listener after full restore
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ ldap_listen_port }}"
    timeout: 90
